apiVersion: apps/v1
kind: Deployment
metadata:
  name: djangoserver
spec:
  replicas: 1
  selector:
    matchLabels:
      app: djangoserver
  template:
    metadata:
      labels:
        app: djangoserver
    spec:
      containers:
        - name: djangoserver
          image: ${DJANGO_IMAGE}
          ports:
            - containerPort: 8000
          envFrom:
            - secretRef:
                name: band-config
          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: djangoserver
spec:
  selector:
    app: djangoserver
  ports:
    - port: 8080
      targetPort: 8000
